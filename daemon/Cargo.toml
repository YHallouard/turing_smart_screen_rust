[package]
name = "bc250-dashboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "TURZX 3.5\" event-driven dashboard daemon for Bazzite / SteamOS"

[[bin]]
name = "bc250-dashboard"
path = "src/main.rs"

[features]
default = []
# Desktop preview window (for animation work on a Mac / desktop).
window = ["preview/window"]
# Real USB panel driver.
serial = ["turzx/serial"]

[dependencies]
turzx = { path = "../crates/turzx" }
renderer = { path = "../crates/renderer" }
preview = { path = "../crates/preview" }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
