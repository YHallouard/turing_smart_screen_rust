# Push a tag `vX.Y.Z` -> build -> GitHub Release. Installed consoles pick it up
# automatically through bc250-update.timer (within ~12 h, or on next boot).
name: release

on:
  push:
    tags: ["v*"]
  # Manual run: builds the tip of main and creates the tag + release itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.3"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    # Oldest supported runner = oldest glibc we link against; SteamOS is newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: System deps (serialport -> libudev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches daemon version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' daemon/Cargo.toml | head -1)
          [ "v$crate" = "$TAG" ] || {
            echo "::error::tag $TAG != daemon/Cargo.toml version $crate"; exit 1; }

      - name: Build
        # x86-64-v3 (AVX2): every Zen 2+ / Haswell+ CPU, incl. BC-250 and Steam Machine.
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: make release

      - name: Package
        run: sh packaging/steamos/package.sh "$TAG" dist-release

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: decky-plugin/package-lock.json

      - name: Decky plugin zip
        run: sh decky-plugin/package.sh "$TAG" dist-release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The release may already exist (created from the GitHub web UI, which
        # creates the tag on publish): then just attach/replace the assets.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            # --target creates the tag at this exact commit when it is missing.
            gh release create "$TAG" dist-release/* --title "$TAG" --generate-notes \
              --target "$(git rev-parse HEAD)"
          fi
