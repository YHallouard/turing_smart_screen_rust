# Horus I — boot animation, portrait 320x480, 10 s.
# Full port of the Claude Design "Boot Horus I" (boot-horus.jsx, LAYOUTS.portrait).
# Cues (absolute s): Power 0.0 · Trace 1.4 · Ignite 4.8 · Wordmark 6.4 · Handoff 8.2 · end 10.0

[scene]
name = "boot"
duration = 10.0
background = "gradient:bg"
orientation = "portrait"

[[gradient]]
name = "bg"
kind = "radial"
radius_scale = 1.25
stops = [ { at = 0.0, color = "#14141b" }, { at = 1.0, color = "#05060a" } ]

[[gradient]]
name = "gold"
kind = "linear"
stops = [ { at = 0.20, color = "#ffd9a0" }, { at = 0.75, color = "#e08a3c" }, { at = 1.00, color = "#8a4f1f" } ]

[[gradient]]
name = "sweep"
kind = "linear"
stops = [ { at = 0.0, color = "#e08a3c00" }, { at = 0.55, color = "#ffd9a052" }, { at = 1.0, color = "#e08a3c00" } ]

[[gradient]]
name = "vignette"
kind = "radial"
radius_scale = 1.0
stops = [ { at = 0.55, color = "#00000000" }, { at = 1.0, color = "#000000b3" } ]

# ── POWER: gold sweep top→bottom ────────────────────────────────────────────
[[layer]]
type = "rect"
x = 0
y = -100
width = 320
height = 100
fill = "gradient:sweep"
[[layer.anim]]
property = "y"
keys = [ { t = 0.04, v = -100.0 }, { t = 0.92, v = 500.0 } ]
easing = "ease_in_out_quad"
[[layer.anim]]
property = "opacity"
keys = [ { t = 0.0, v = 1.0 }, { t = 0.7, v = 1.0 }, { t = 1.0, v = 0.0 } ]
easing = "ease_out_cubic"

