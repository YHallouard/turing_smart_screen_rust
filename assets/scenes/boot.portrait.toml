# Horus I — boot scene, portrait (320x480). Minimal-motion: a static seal, then
# the name fades in below it. No dashboard here — the daemon hard-cuts to
# `dashboard.portrait.toml` when this scene ends (see docs/BOOT_HORUS.md).
#
# Asset : ../logo/horus-seal-240.png (240x240) — cf. assets/logo/README.md.
# The engine blits images at native size * `scale` and ignores width/height,
# so `scale = 190/240` puts the seal in the design's 190x190 box.

[scene]
name = "boot"
duration = 3.0
background = "#05060a"
orientation = "portrait"

# --- LOGO : drawn frame 1, never animates -----------------------------------
[[layer]]
type = "image"
source = "../logo/horus-seal-240.png"
x = 65
y = 100
scale = 0.791667

# --- NAME : fades in, then holds until the daemon cuts to the dashboard -----
[[layer]]
type = "text"
value = "HORUS I"
x = 97
y = 330
scale = 3
color = "#eece86"
[[layer.anim]]
property = "opacity"
easing = "ease_out"
keys = [ { t = 0.0, v = 0.0 }, { t = 0.6, v = 0.0 }, { t = 1.2, v = 1.0 } ]

[[layer]]
type = "text"
value = "GAMIN CORP"
x = 100
y = 366
scale = 2
color = "#8a6f37"
[[layer.anim]]
property = "opacity"
easing = "linear"
keys = [ { t = 0.0, v = 0.0 }, { t = 1.2, v = 0.0 }, { t = 1.8, v = 1.0 } ]
