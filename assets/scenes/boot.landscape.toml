# Horus I — boot scene, landscape (480x320). Minimal-motion: a static seal on
# the left, the name fading in on the right. No dashboard here — the daemon
# hard-cuts to `dashboard.landscape.toml` when this scene ends.
#
# Asset : ../logo/horus-seal-240.png (240x240) — cf. assets/logo/README.md.
# `scale = 170/240` puts the seal in the design's 170x170 box.

[scene]
name = "boot"
duration = 3.0
background = "#05060a"
orientation = "landscape"

# --- LOGO : drawn frame 1, never animates -----------------------------------
[[layer]]
type = "image"
source = "../logo/horus-seal-240.png"
x = 40
y = 75
scale = 0.708333

# --- NAME : fades in, then holds until the daemon cuts to the dashboard -----
[[layer]]
type = "text"
value = "HORUS I"
x = 269
y = 135
scale = 3
color = "#eece86"
[[layer.anim]]
property = "opacity"
easing = "ease_out"
keys = [ { t = 0.0, v = 0.0 }, { t = 0.6, v = 0.0 }, { t = 1.2, v = 1.0 } ]

[[layer]]
type = "text"
value = "GAMIN CORP"
x = 269
y = 171
scale = 2
color = "#8a6f37"
[[layer.anim]]
property = "opacity"
easing = "linear"
keys = [ { t = 0.0, v = 0.0 }, { t = 1.2, v = 0.0 }, { t = 1.8, v = 1.0 } ]
