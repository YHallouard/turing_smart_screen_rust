# Horus I — alerte matérielle, paysage (480x320). Scène paramétrique : le daemon
# remplit les `{{ alert.* }}` selon l'alerte active. Voir alert.portrait.toml.

[scene]
name = "alert"
duration = 8.0
background = "#05060a"
orientation = "landscape"

[[layer]]
type = "stroke_rect"
x = 0
y = 0
width = 480
height = 320
stroke_width = 3
color = "#ff5b4a"
[[layer.anim]]
property = "opacity"
keys = [{ t = 0, v = 0 }, { t = 0.03, v = 1 }]
easing = "linear"

[[layer]]
type = "rect"
x = 0
y = 98
width = 480
height = 124
color = "#14060a"
[[layer.anim]]
property = "opacity"
keys = [{ t = 0, v = 0 }, { t = 0.03, v = 1 }]
easing = "linear"

