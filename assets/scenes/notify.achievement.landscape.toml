# Horus I — panneau "succès Steam débloqué".
# Généré depuis scenes-alerts.js (source unique : le préview HTML
# "Notifications & Alertes.dc.html" joue exactement ces layers).
#
# STATIQUE PAR CHOIX : le panneau est vu de loin et son rafraîchissement ne rend
# pas le mouvement — donc un hard cut, un hold de 7,8 s (le temps de lire), un
# hard cut. Aucun glissement, aucune cascade, aucun remplissage progressif.
#
# ASSET : assets/notify/achievement.png (128x128 RGBA), blittée 1:1 ici.

[scene]
name = "notify_achievement"
duration = 8.0
background = "#05060a"
orientation = "landscape"

[[layer]]
type = "rect"
x = 40
y = 56
width = 400
height = 2
color = "#eece86"
[[layer.anim]]
property = "opacity"
keys = [{ t = 0, v = 0 }, { t = 0.03, v = 1 }, { t = 7.8, v = 1 }, { t = 7.83, v = 0 }]
easing = "linear"

[[layer]]
type = "rect"
x = 40
y = 268
width = 400
height = 1
color = "#8a6f37"
[[layer.anim]]
property = "opacity"
keys = [{ t = 0, v = 0 }, { t = 0.03, v = 1 }, { t = 7.8, v = 1 }, { t = 7.83, v = 0 }]
easing = "linear"

[[layer]]
type = "text"
value = "SUCCES DEBLOQUE"
x = 200
y = 96
scale = 2
color = "#8a6f37"
[[layer.anim]]
property = "opacity"
keys = [{ t = 0, v = 0 }, { t = 0.03, v = 1 }, { t = 7.8, v = 1 }, { t = 7.83, v = 0 }]
easing = "linear"

[[layer]]
type = "image"
source = "../notify/achievement.png"
x = 40
y = 96
width = 128
height = 128
[[layer.anim]]
property = "opacity"
keys = [{ t = 0, v = 0 }, { t = 0.03, v = 1 }, { t = 7.8, v = 1 }, { t = 7.83, v = 0 }]
easing = "linear"

[[layer]]
type = "text"
value = "{{ achievement.name }}"
x = 200
y = 128
scale = 4
max_width = 264
color = "#eece86"
[[layer.anim]]
property = "opacity"
keys = [{ t = 0, v = 0 }, { t = 0.03, v = 1 }, { t = 7.8, v = 1 }, { t = 7.83, v = 0 }]
easing = "linear"

[[layer]]
type = "text"
value = "{{ game.name }}"
x = 200
y = 190
scale = 2
max_width = 264
color = "#c9a24b"
[[layer.anim]]
property = "opacity"
keys = [{ t = 0, v = 0 }, { t = 0.03, v = 1 }, { t = 7.8, v = 1 }, { t = 7.83, v = 0 }]
easing = "linear"

[[layer]]
type = "text"
value = "{{ achievement.progress }}"
x = 200
y = 218
scale = 2
color = "#5f4e2c"
[[layer.anim]]
property = "opacity"
keys = [{ t = 0, v = 0 }, { t = 0.03, v = 1 }, { t = 7.8, v = 1 }, { t = 7.83, v = 0 }]
easing = "linear"

[[layer]]
type = "progress_bar"
value = "{{ achievement.frac }}"
x = 200
y = 246
width = 240
height = 6
color = "#c9a24b"
[[layer.anim]]
property = "opacity"
keys = [{ t = 0, v = 0 }, { t = 0.03, v = 1 }, { t = 7.8, v = 1 }, { t = 7.83, v = 0 }]
easing = "linear"
