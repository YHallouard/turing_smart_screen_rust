[workspace]
resolver = "2"
members = ["crates/turzx", "crates/renderer", "crates/preview", "daemon"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
